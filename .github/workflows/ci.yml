name: CI

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  test:
    name: Babel ${{ matrix.babel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        babel: ["7", "8", "latest"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm run build

      - name: Use Babel ${{ matrix.babel }}
        if: matrix.babel != '7'
        run: pnpm add -D @babel/core@${{ matrix.babel }} @babel/preset-react@${{ matrix.babel }} @babel/types@${{ matrix.babel }}

      - name: Run tests
        run: pnpm run test:ci
